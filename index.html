<meta name="apple-mobile-web-app-title" content="Controle Estágio">
<meta name="application-name" content="Controle Estágio">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ouro:#c59e4f;--ouro2:#a8833a;--preto:#111;--bg:#f4f2ee;--card:#fff;--tx:#1b1b1b;--mut:#5e5a52;--ln:#e2ddd2;--ok:#0b9247;--bad:#dc2828;--warn:#b7791f;--okbg:#e6f4ec;--badbg:#fdeaea;--warnbg:#fbf1dd}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:18px}h3{font-size:15px}
a{color:var(--ouro2)}
header{background:var(--preto);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--ouro)}
header .hb img{height:40px;width:auto;display:block}
header .t{font-family:Archivo;font-weight:800;letter-spacing:.02em}
header .s{font-size:12px;color:#d9c79f}
main{max-width:860px;margin:0 auto;padding:14px 16px 96px;display:grid;gap:12px}
body.reg main{max-width:1180px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eee}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.gold{background:#f3ead7;color:#7a5d22}
button,.btn{font:600 15px "Public Sans",sans-serif;border:0;border-radius:10px;padding:12px 16px;background:var(--preto);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.gold,.btn.gold{background:var(--ouro);color:#111}
button.ghost,.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln)}
button.sm,.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
button.big{width:100%;padding:16px;font-size:17px}
button:disabled{opacity:.5}
input,select,textarea{font:15px "Public Sans",sans-serif;width:100%;padding:10px;border:1px solid var(--ln);border-radius:9px;background:#fff;color:var(--tx)}
textarea{min-height:80px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.list{display:grid;gap:8px}
.item{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:#fff;min-width:0}
.item.gold{border-left:4px solid var(--ouro)}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{background:none;color:var(--mut);flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;border-radius:8px}
.tabbar button.on{color:#111;background:#f3ead7}
.tabbar svg{width:22px;height:22px}
.rtabs{display:flex;gap:6px;flex-wrap:wrap}
.rtabs button{background:#fff;color:var(--tx);border:1px solid var(--ln);padding:8px 12px;font-size:13px}
.rtabs button.on{background:var(--preto);color:#fff;border-color:var(--preto)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--ln);padding:7px 6px;text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.yn{display:flex;gap:6px}.yn label{flex:1;border:1px solid var(--ln);border-radius:8px;padding:6px;text-align:center;font-size:13px;cursor:pointer}
.yn input{display:none}.yn input:checked+span{font-weight:700}
.yn label:has(input:checked){background:#f3ead7;border-color:var(--ouro)}
.q{display:grid;gap:6px;padding:8px 0;border-bottom:1px dashed var(--ln)}
.center{text-align:center}
.big-ic{width:56px;height:56px;margin:0 auto;color:var(--ouro2)}
.sec-h{display:flex;align-items:center;gap:8px;margin-top:4px}
.sec-h:before{content:"";width:4px;height:18px;background:var(--ouro);border-radius:2px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;display:grid;place-items:center;padding:16px}
.ov .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
img.prev{max-width:100%;border-radius:10px}
.load{padding:40px;text-align:center;color:var(--mut)}
.cracha{background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--ln);box-shadow:0 6px 24px rgba(0,0,0,.12);max-width:360px;width:100%;margin:0 auto;display:grid;justify-items:center;text-align:center;padding-bottom:12px}
.cr-top{background:#111;color:#fff;width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:4px solid var(--ouro);text-align:left}
.cr-top img{height:58px;width:auto}
.cr-org{font:800 20px Archivo,sans-serif;letter-spacing:.06em;color:var(--ouro)}.cr-sub{font-size:12px;color:#ddd}
.cr-reg{font-size:12px;font-weight:600;color:var(--mut);padding:8px 12px 0}
.cr-foto{width:150px;height:200px;margin:10px 0 6px;border:3px solid var(--ouro);border-radius:8px;overflow:hidden;background:#eee;display:grid;place-items:center;color:var(--mut)}
.cr-foto img{width:100%;height:100%;object-fit:cover}
.cr-nome{font:800 19px Archivo,sans-serif;padding:0 14px;line-height:1.2;text-wrap:balance}
.cr-func{margin-top:4px;background:var(--ouro);color:#111;font:800 13px Archivo,sans-serif;letter-spacing:.12em;padding:3px 14px;border-radius:4px}
.cr-dados{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;text-align:left;font-size:13px;margin:10px 16px 6px;width:calc(100% - 32px)}
.cr-dados dt{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}.cr-dados dd{margin:0;font-weight:600}
.cr-val{font-weight:700;font-size:13px;color:var(--ok)}.cr-val.bad{color:var(--bad)}
.cr-relogio{display:flex;align-items:center;gap:6px;font:600 13px ui-monospace,monospace;margin-top:4px}
.cr-relogio .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.2}}
.cr-obs{font-size:10px;color:var(--mut);padding:6px 14px 0}
.cr-ov{background:#111;align-content:center;gap:12px;overflow:auto}
.who{display:inline-flex;align-items:center;gap:8px;min-width:0}
.av{width:32px;height:42px;border-radius:5px;object-fit:cover;flex:none;border:1.5px solid var(--ouro);cursor:zoom-in;background:#eee}
.av.lg{width:54px;height:72px}
.av.ini{display:inline-grid;place-items:center;font:700 12px Archivo,sans-serif;color:#7a5d22;background:#f3ead7;border-style:dashed;cursor:default}
.legal{font-size:13px;line-height:1.5;max-height:46vh;overflow:auto;border:1px solid var(--ln);border-radius:9px;padding:10px;background:#faf8f4}
</style>
</head>

/* ---------- arquivos e foto ---------- */
function fileToB64(file, maxW) {
  return new Promise((res, rej) => {
    if (!file) return rej(new Error('Nenhum arquivo.'));
    if (file.size > 9e6) return rej(new Error('Arquivo maior que 9 MB.'));
    const r = new FileReader();
    r.onload = () => {
      if (!/^image[/]/.test(file.type) || !maxW) return res({ b64: r.result, mime: file.type || 'application/pdf' });
      const img = new Image();
      img.onload = () => { const k = Math.min(1, maxW / img.width); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res({ b64: c.toDataURL('image/jpeg', .72), mime: 'image/jpeg' }); };
      img.onerror = () => res({ b64: r.result, mime: file.type });
      img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

/* ---------- GPS ---------- */
function gpsGet() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ err: 'indisponivel' });
    navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
      e => res({ err: e.code === 1 ? 'bloqueado' : 'indisponivel' }), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}
const GPS_HELP = `<div class="item"><b>Android (Chrome)</b><span class="mut">Toque no cadeado ao lado do endereço › Permissões › Local › Permitir. Confira também se a Localização do celular está ligada (puxe a barra de cima › Local).</span></div>
<div class="item"><b>iPhone</b><span class="mut">Ajustes › Privacidade e Segurança › Serviços de Localização: ligado. Depois, em Ajustes › Safari (ou Chrome) › Localização › Perguntar ou Permitir.</span></div>
<div class="item"><b>Abriu pelo WhatsApp?</b><span class="mut">Toque nos três pontinhos e escolha “Abrir no navegador” (Chrome ou Safari). O navegador interno do WhatsApp às vezes bloqueia o GPS.</span></div>`;
function gpsBlocked(retry) {
  const o = overlay(`<div class="center"><svg class="big-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
    <h2 class="center">Libere a localização (GPS)</h2>
    <p class="mut center">O check-in só é registrado com a sua localização. Ela está bloqueada neste aparelho. Desbloqueie e toque em “Tentar de novo”.</p>${GPS_HELP}
    <button class="gold big" id="gpsRetry">Tentar de novo</button>`);
  o.querySelector('#gpsRetry').onclick = () => { o.remove(); retry(); };
}

/* Envio de documento: tirar foto com a câmera do celular ou escolher arquivo (foto ou PDF). */
const PICKED = {};
function fileField(id, label) {
  return `<div class="f" style="display:grid;gap:6px"><span style="font-size:13px;font-weight:600">${label}</span><div class="row">
    <label class="btn sm gold">📷 Tirar foto<input type="file" accept="image/&#42;" capture="environment" hidden data-pick="${id}"></label>
    <label class="btn sm ghost">Escolher arquivo<input type="file" accept="image/&#42;,application/pdf" hidden data-pick="${id}"></label></div>
    <span class="mut" id="${id}_nome">Nenhum arquivo escolhido.</span></div>`;
}
function pickFile(id) { return PICKED[id] || null; }
document.addEventListener('change', ev => { const i = ev.target; if (!i.dataset || !i.dataset.pick || !i.files[0]) return;
  PICKED[i.dataset.pick] = i.files[0]; const n = document.getElementById(i.dataset.pick + '_nome'); if (n) n.textContent = '✓ ' + (i.files[0].name || 'foto da câmera'); });
function podeFoto() { const e = S.est; return !e.fotoPend && (!e.foto || e.fotoTroca === 'Liberada'); }
function foto3x4(file) {
  return new Promise((res, rej) => {
    if (!file) return rej(new Error('Nenhuma foto.'));
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const W = 300, H = 400, k = Math.max(W / img.width, H / img.height), w = img.width * k, h = img.height * k;
      const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(img, (W - w) / 2, (H - h) / 2.6, w, h);
      let q = .8, out = c.toDataURL('image/jpeg', q); while (out.length > 42000 && q > .3) { q -= .1; out = c.toDataURL('image/jpeg', q); }
      res(out); }; img.onerror = () => rej(new Error('Imagem inválida.')); img.src = r.result; };
    r.readAsDataURL(file);
  });
}

function ckPill(c) {
  const ontem = new Date(new Date(S.hoje + 'T12:00:00') - 864e5).toISOString().slice(0, 10);
  if ((!c.confirmacao || c.confirmacao === 'Pendente') && c.ts && String(c.ts).slice(0, 10) < ontem) return '<span class="pill bad">Sem confirmação no prazo</span>';
  return c.confirmacao === 'Confirmado' ? `<span class="pill ok">Confirmado${c.confirmadoPor ? ' · ' + esc(c.confirmadoPor.split(' ')[0]) : ''}</span>`
    : c.confirmacao === 'Não confirmado' ? `<span class="pill bad">Não confirmado</span>` : '<span class="pill warn">Aguardando confirmação</span>';
}

async function checkin(tipo) {
  const g = await gpsGet();
  if (g.err === 'bloqueado') { try { localStorage.removeItem('srpma_gps'); } catch (e) {} return gpsBlocked(() => checkin(tipo)); }
  let gpsTxt = g.err ? 'indisponível' : 'ok';
  if (g.err && !checkin.retried) { checkin.retried = true; return overlay(`<h2>Localização não encontrada</h2><p class="mut">Confira se a Localização do celular está ligada e tente de novo. Em local fechado, chegue perto de uma janela.</p>
    <button class="gold big" onclick="closeOv();checkin('${tipo}')">Tentar de novo</button>`); }
  checkin.retried = false;
  if (g.err) {
    const o = overlay(`<h2>Registrar ${tipo.toLowerCase()} sem localização?</h2><p class="mut">A localização continua indisponível. O registro será marcado para conferência da regional.</p>
      <button class="gold big" id="ckSend">Registrar mesmo assim</button><button class="ghost" onclick="closeOv()">Cancelar</button>`);
    o.querySelector('#ckSend').onclick = async e => { if (await act(e.target, 'checkin', { tipo, gps: gpsTxt }, tipo + ' registrada.')) closeOv(); };
    return;
  }
  await act(null, 'checkin', { tipo, lat: g.lat, lng: g.lng, acc: g.acc, gps: gpsTxt }, tipo + ' registrada às ' + new Date().toTimeString().slice(0, 5) + '.');
}

/* Responsável local registra a entrada ou a saída do estagiário sem internet, com o GPS do próprio celular. */
function checkinPor(estId, nome, tipo) {
  const t = tipo.toLowerCase();
  const o = overlay(`<h2>Registrar ${t} de ${esc(nome)}</h2><p class="mut">Use quando o estagiário estiver sem internet. Faça na hora em que ele(a) ${tipo === 'Entrada' ? 'chegar' : 'sair'}, na CPMA: o registro fica com o horário de agora e a localização (GPS) do <b>seu</b> celular, e já entra como confirmado por você.</p>
    <label class="f">Observação (opcional)<input id="cpObs" placeholder="Ex.: celular sem internet"></label>
    <button class="gold big" id="cpSend">Registrar ${t} agora</button><button class="ghost" onclick="closeOv()">Cancelar</button>`);
  o.querySelector('#cpSend').onclick = async ev => {
    const btn = ev.target; btn.disabled = true; btn.textContent = 'Obtendo a localização…';
    const g = await gpsGet();
    btn.disabled = false; btn.textContent = 'Registrar ' + t + ' agora';
    if (g.err === 'bloqueado') { closeOv(); return gpsBlocked(() => { closeOv(); checkinPor(estId, nome, tipo); }); }
    if (g.err) return toast('Localização não encontrada. Ligue a Localização do celular e tente de novo.');
    if (await act(btn, 'checkinPor', { estId, tipo, lat: g.lat, lng: g.lng, acc: g.acc, obs: o.querySelector('#cpObs').value.trim() }, tipo + ' de ' + nome.split(' ')[0] + ' registrada às ' + new Date().toTimeString().slice(0, 5) + '.')) closeOv();
  };
}

/* ---------- prorrogação e recesso ---------- */
function solItem(x, papel) {
  const st = (v, quem) => v ? (/^Não concorda/.test(v) ? `<span class="pill bad">${quem}: não concorda</span>` : `<span class="pill ok">${quem} ✓</span>`) : `<span class="pill warn">${quem}: pendente</span>`;
  const meu = papel === 'est' ? x.estOk : papel === 'sup' ? x.supOk : papel === 'loc' ? x.locOk : 'x';
  const pode = papel && papel !== 'reg' && !meu && /^Aguardando/.test(x.status) && !(papel === 'loc' && x.locNA);
  return `<div class="item gold"><div class="row sp"><span class="row">${av(x.estId, x.nome)}<b>${x.tipo === 'Recesso' ? 'Recesso' : 'Prorrogação do TCE'} · ${esc(x.nome)}</b></span><span class="pill ${/CIEE|Encaminh|Conclu/.test(x.status) ? 'ok' : /Não|Indefer/.test(x.status) ? 'bad' : 'warn'}">${esc(x.status.replace('Aguardando regional', 'Aguardando concedente'))}</span></div>
    <span class="mut">Aberto por ${esc(x.origem)} em ${brts(x.ts)}${x.tipo === 'Recesso' ? ` · ${br(x.ini)} a ${br(x.fim)} (${esc(x.dias)} dias)` : ''}</span>${x.texto ? `<span>${esc(x.texto)}</span>` : ''}
    ${x.matriculaUrl ? `<a href="${esc(x.matriculaUrl)}" target="_blank">Comprovante de matrícula ↗</a>` : ''}
    <div class="row">${st(x.estOk, 'Estagiário')}${st(x.supOk, 'Supervisor')}${x.locNA ? '<span class="pill">Resp. local: não se aplica</span>' : st(x.locOk, 'Resp. local')}${concPill(x)}</div>
    ${pode ? `<input data-solobs="${x.id}" placeholder="Observação (opcional)"><div class="row"><button class="sm gold" data-solok="${x.id}">${x.tipo === 'Recesso' ? 'Confirmo o recesso' : 'Confirmo o interesse na prorrogação'}</button><button class="sm ghost" data-solno="${x.id}">Não concordo</button></div>` : ''}</div>`;
}
/* Situação do pedido no concedente (regional), sempre visível para todos os perfis. */
function concPill(x) {
  const s = x.status || '';
  if (/Indeferid/.test(s)) return `<span class="pill bad">Concedente: indeferido${x.obs ? ' – ' + esc(x.obs) : ''}</span>`;
  if (/emitido|aprovado/.test(s)) return `<span class="pill ok">Concedente: ${esc(s)}</span>`;
  if (/solicitado ao CIEE/.test(s)) return `<span class="pill ok">Concedente: ${esc(s)} em ${br(x.regOk)}</span>`;
  if (s === 'Aguardando regional') return '<span class="pill warn">Concedente: em análise</span>';
  if (/Não confirmado/.test(s)) return '<span class="pill bad">Concedente: não encaminhado (falta confirmação)</span>';
  return '<span class="pill">Concedente: aguardando as confirmações</span>';
}

    act(e.target, 'confirmarSol', { id, concordo: !b.dataset.solno, obs: obs.trim() }, 'Confirmação registrada.');

  R.sec.forEach(s => {

    if (s.id === 's3') h += `<h3 class="sec-h">4. Avaliação de desempenho</h3><table>${R.conceitos.map((c, i) => `<tr><td>${c}</td><td><b>${esc((d.conc || {})['c' + i])}</b></td><td class="mut">${esc((d.conc || {})['j' + i])}</td></tr>`).join('')}</table><p><b>Pontos fortes:</b> ${esc(d.fortes)}</p><p><b>A desenvolver:</b> ${esc(d.desenvolver)}</p>`;
    if (s.id === 's5') h += `${d.saude ? `<p>${esc(d.saude)}</p>` : ''}<h3 class="sec-h">6. Ocorrências</h3><p>${esc(d.ocorrencias) || 'Sem ocorrências.'}</p>`;
    if (s.id === 's7') h += `<p><b>Fundamentação:</b> ${esc(d.fundamentacao)}</p>`;
  });
  h += `<h3 class="sec-h">8. Ciência</h3><table><tr><td>Supervisor(a)</td><td>${brts(r.supCiente)} · ${esc(r.supLocal)}</td></tr><tr><td>Estagiário(a)</td><td>${brts(r.estCiente)} · ${esc(r.estLocal)}</td></tr>${r.locCiente ? `<tr><td>Responsável local (${esc(r.locNome)})</td><td>${brts(r.locCiente)} · ${esc(r.locLocal)}</td></tr>` : ''}<tr><td>Regional</td><td>${brts(r.regCiente)} · ${esc(r.regLocal)}</td></tr></table>${r.estManif ? `<p class="mut">Manifestação do estagiário: ${esc(r.estManif)}</p>` : ''}${r.locObs ? `<p class="mut">Manifestação do responsável local: ${esc(r.locObs)}</p>` : ''}`;
  return h;
}

  <div class="card"><h3 class="sec-h">Todos os pedidos</h3><div class="list">${S.solicitacoes.map(x => solItem(x, null)).join('') || '<span class="mut">Nenhum pedido.</span>'}</div></div>`;

/* Relatórios do mês anterior ainda não concluídos pelo supervisor (prazo: dia 10). */
function relPendHtml(sup, mesAnt) {
  const falta = sup.filter(e => !S.relatorios.some(r => r.estId === e.id && r.mes === mesAnt && r.status !== 'Rascunho'));
  if (!falta.length || mesAnt < S.inicioApp) return '';
  const dia = +S.hoje.slice(8, 10), atrasado = dia > 10;
  return `<div class="item" style="border-color:${atrasado ? 'var(--bad)' : 'var(--ouro)'}"><b>${atrasado ? 'Atrasado' : 'Pendente'}: relatório de ${mesNome(mesAnt)} (prazo dia 10)</b>${falta.map(e => `<span>${who(e.id, e.nome, 1)}</span>`).join('')}</div>`;
}
function pesChamados() {
  return `<div class="card"><h2>Chamados dos estagiários</h2><div class="list">${S.chamados.map(c => chamadoItem(c, true)).join('') || '<span class="mut">Nenhum chamado.</span>'}</div></div>`;
}
function bindLocal() {
  document.querySelectorAll('[data-ckpor]').forEach(b => b.onclick = () => checkinPor(b.dataset.est, b.dataset.nome, b.dataset.ckpor));
  document.querySelectorAll('[data-ckok],[data-ckno]').forEach(b => b.onclick = e => {
    const id = b.dataset.ckok || b.dataset.ckno, obs = (document.querySelector(`[data-ckobs="${id}"]`) || {}).value || '';
    if (b.dataset.ckno && !obs.trim()) return toast('Informe o motivo.');
    act(e.target, 'confirmarCheckin', { ids: [id], confirmar: !!b.dataset.ckok, obs: obs.trim() }, b.dataset.ckok ? 'Check-in confirmado.' : 'Registrado como não confirmado.');
  });
  document.querySelectorAll('[data-ckall]').forEach(b => b.onclick = e => act(e.target, 'confirmarCheckin', { ids: (S.checkinsPend || (S.local || {}).checkinsPend || []).map(c => c.id), confirmar: true }, 'Check-ins confirmados.'));
  document.querySelectorAll('[data-fok],[data-fno]').forEach(b => b.onclick = e => {
    const id = b.dataset.fok || b.dataset.fno, obs = (document.querySelector(`[data-fobs="${id}"]`) || {}).value || '';
    if (b.dataset.fno && !obs.trim()) return toast('Informe o motivo da recusa.');
    act(e.target, 'aprovarFoto', { id, aprovar: !!b.dataset.fok, obs: obs.trim() }, b.dataset.fok ? 'Foto aprovada.' : 'Foto recusada. O estagiário foi avisado.');
  });
  document.querySelectorAll('[data-rloc]').forEach(b => b.onclick = () => {
    const r = S.relatorios.find(x => x.id === b.dataset.rloc);
    const o = overlay(relHtml(r) + `<div class="card" style="border-color:var(--ouro)"><b>Ciência do(a) responsável local</b>
      <label class="row" style="font-weight:600;flex-wrap:nowrap"><input type="checkbox" id="lVer" style="width:auto"> Li e verifiquei todo o relatório, inclusive a manifestação do estagiário.</label>
      <label class="f">Sua manifestação (obrigatória)<textarea id="lObs" placeholder="Ex.: De acordo. A frequência confere com os check-ins confirmados."></textarea></label><label class="f">Local<input id="lLoc" placeholder="Ex.: São Paulo"></label>
      <span class="mut">Data e hora são registradas automaticamente.</span><button class="gold big" id="lOk">Ciente do relatório de ${mesNome(r.mes)}</button></div><button class="ghost" onclick="closeOv()">Fechar</button>`);
    o.querySelector('#lOk').onclick = async e => {
      if (!o.querySelector('#lVer').checked) return toast('Confirme que leu e verificou o relatório.');
      if (!o.querySelector('#lObs').value.trim()) return toast('Escreva sua manifestação.');
      if (!o.querySelector('#lLoc').value.trim()) return toast('Informe o local.');
      if (await act(e.target, 'cienteRelatorioLocal', { id: r.id, verificado: true, local: o.querySelector('#lLoc').value.trim(), obs: o.querySelector('#lObs').value.trim() }, 'Ciência registrada. O relatório seguiu para a regional.')) closeOv();
    };
  });
  document.querySelectorAll('[data-lsup]').forEach(b => b.onclick = e => act(e.target, 'cienteSupervisao', { id: b.dataset.lsup }, 'Ciência registrada.'));
}
function bindPes() {
  document.querySelectorAll('[data-cc]').forEach(b => b.onclick = e => act(e.target, 'cienteComunicacao', { id: b.dataset.cc }, 'Ciência registrada.'));
  bindSol();
  const sr = $('#srBtn'); if (sr) sr.onclick = e => {
    if (!$('#srIni').value || !$('#srFim').value || !$('#srDias').value) return toast('Informe o período e os dias.');
    act(e.target, 'solicitar', { estId: $('#srEst').value, tipo: 'Recesso', ini: $('#srIni').value, fim: $('#srFim').value, dias: $('#srDias').value, texto: $('#srTxt').value.trim() }, 'Pedido de recesso enviado.');
  };
  bindLocal();
  bindResp();
  const ab = $('#aBtn'); if (ab) ab.onclick = e => {
    if (!$('#aData').value || !$('#aHora').value) return toast('Informe data e hora.');
    act(e.target, 'agendar', { estId: $('#aEst').value, data: $('#aData').value, hora: $('#aHora').value, link: $('#aLink').value.trim(), obs: $('#aObs').value.trim() }, 'Supervisão marcada. O estagiário foi avisado.');
  };
  const fo = $('#fOpen'); if (fo) fo.onclick = () => relForm($('#fEst').value, $('#fMes').value);
  document.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => { const r = S.relatorios.find(x => x.id === b.dataset.rv);
    if (r.status === 'Rascunho') return relForm(r.estId, r.mes); overlay(relHtml(r) + '<button class="ghost" onclick="closeOv()">Fechar</button>'); });
}
function bindResp() {
  document.querySelectorAll('[data-respb]').forEach(b => b.onclick = e => {
    const t = document.querySelector(`[data-resp="${b.dataset.respb}"]`).value.trim(); if (!t) return toast('Escreva a resposta.');
    act(e.target, 'responder', { id: b.dataset.respb, resposta: t }, 'Resposta enviada.');
  });

function relForm(estId, mes) {
  if (!estId || !mes) return toast('Escolha o estagiário e o mês.');
  const e = S.equipe.find(x => x.id === estId);
  const old = S.relatorios.find(r => r.estId === estId && r.mes === mes);
  if (old && old.status !== 'Rascunho') return overlay(relHtml(old) + '<button class="ghost" onclick="closeOv()">Fechar</button>');
  const d = (old && old.dados) || {}, R = S.rel;
  const coms = S.comunicacoes.filter(c => c.estId === estId && String(c.data).slice(0, 7) === mes);
  const yn = (k) => { const v = (d.yn || {})[k]; return `<div class="yn"><label><input type="radio" name="${k}" value="S" ${v === 'S' ? 'checked' : ''}><span>Sim</span></label><label><input type="radio" name="${k}" value="N" ${v === 'N' ? 'checked' : ''}><span>Não</span></label></div>`; };
  const ta = (k, l) => `<label class="f">${l}<textarea data-k="${k}">${esc(d[k])}</textarea></label>`;
  let h = `<span class="lbl">Relatório mensal de supervisão de estágio</span><div class="row">${av(e.id, e.nome, 'lg')}<h2>${esc(e.nome)} · ${mesNome(mes)}</h2></div>
    ${coms.length ? `<div class="item gold"><b>Comunicações do estagiário no mês</b>${coms.map(c => `<span class="mut">${br(c.data)} · ${esc(c.tipo)} ${esc(c.hIni)}${c.hFim ? '–' + esc(c.hFim) : ''} · ${esc(c.motivo)}</span>`).join('')}</div>` : ''}
    <h3 class="sec-h">2. Frequência e jornada</h3>${R.freq.map(f => `<label class="f">${f[1]}<input data-f="${f[0]}" value="${esc((d.freq || {})[f[0]])}"></label>`).join('')}`;
  R.sec.forEach(s => {
    if (s.id === 's3') h += `<h3 class="sec-h">3. Atividades desenvolvidas</h3>${ta('atividades', R.textos[0][1])}${ta('foraPlano', R.textos[1][1])}`;
    else if (s.id !== 's2') h += `<h3 class="sec-h">${s.titulo}</h3>`;
    h += s.itens.map((t, i) => `<div class="q"><span>${t}</span>${yn(s.id + '_' + i)}</div>`).join('') + ta('obs_' + s.id, 'Observações (obrigatório se alguma resposta for Não)');
    if (s.id === 's3') h += `<h3 class="sec-h">4. Avaliação de desempenho</h3><span class="mut">O = Ótimo · B = Bom · R = Regular · I = Insuficiente. R ou I exige justificativa.</span>` +
      R.conceitos.map((c, i) => `<div class="q"><span>${c}</span><div class="row"><select data-c="c${i}" style="width:90px"><option></option>${['O','B','R','I'].map(o => `<option ${(d.conc || {})['c' + i] === o ? 'selected' : ''}>${o}</option>`).join('')}</select><input data-c="j${i}" placeholder="Justificativa" value="${esc((d.conc || {})['j' + i])}" style="flex:1;min-width:140px"></div></div>`).join('') +
      ta('fortes', R.textos[2][1]) + ta('desenvolver', R.textos[3][1]);
    if (s.id === 's5') h += ta('saude', R.textos[4][1]) + `<h3 class="sec-h">6. Ocorrências e providências</h3>` + ta('ocorrencias', R.textos[5][1]);
    if (s.id === 's7') h += ta('fundamentacao', R.textos[6][1]);
  });
  h += `<div class="card" style="border-color:var(--ouro)"><b>Ciência do(a) supervisor(a)</b><label class="f">Local<input id="sLoc" placeholder="Ex.: São Paulo"></label><span class="mut">Data e hora são registradas automaticamente ao concluir.</span>
    <button class="gold big" id="rConc">Concluir relatório e marcar Ciente</button></div><div class="row"><button class="ghost" id="rSave">Salvar rascunho</button><button class="ghost" onclick="closeOv()">Fechar</button></div>`;
  const o = overlay(h);
  const collect = () => {
    const out = { freq: {}, yn: {}, conc: {} };
    o.querySelectorAll('[data-f]').forEach(i => out.freq[i.dataset.f] = i.value.trim());
    o.querySelectorAll('input[type=radio]:checked').forEach(i => out.yn[i.name] = i.value);
    o.querySelectorAll('[data-c]').forEach(i => out.conc[i.dataset.c] = i.value.trim());
    o.querySelectorAll('[data-k]').forEach(i => out[i.dataset.k] = i.value.trim());
    return out;
  };
  o.querySelector('#rSave').onclick = async ev => { if (await act(ev.target, 'salvarRelatorio', { estId, mes, dados: collect() }, 'Rascunho salvo.')) closeOv(); };
  o.querySelector('#rConc').onclick = async ev => {
    const dd = collect(), tot = R.sec.reduce((a, s) => a + s.itens.length, 0);
    if (Object.keys(dd.yn).length < tot) return toast('Marque Sim ou Não em todas as afirmações.');
    const semObs = R.sec.filter(s => s.itens.some((t, i) => dd.yn[s.id + '_' + i] === 'N') && !dd['obs_' + s.id]);
    if (semObs.length && !/7\./.test(semObs[0].titulo)) return toast('Preencha as observações de "' + semObs[0].titulo + '" (há resposta Não).');
    if (R.conceitos.some((c, i) => /[RI]/.test(dd.conc['c' + i]) && !dd.conc['j' + i])) return toast('Justifique os conceitos R ou I.');
    if (!dd.atividades) return toast('Descreva as atividades do mês.');
    if (!o.querySelector('#sLoc').value.trim()) return toast('Informe o local.');
    if (await act(ev.target, 'salvarRelatorio', { estId, mes, dados: dd, concluir: true, local: o.querySelector('#sLoc').value.trim() }, 'Relatório concluído e enviado ao estagiário.')) closeOv();
  };
}

  <label class="f">Texto<textarea id="avTxt"></textarea></label><label class="f">Link (opcional: notícia da Polícia Penal, arquivo do Drive, manual)<input id="avLink" placeholder="https:\/\/"></label>
  <button class="gold" id="avBtn">Publicar</button></div>
  <div class="card"><h3 class="sec-h">Avisos ativos</h3><div class="list">${S.avisos.map(a => `<div class="item gold"><div class="row sp"><span class="pill gold">${esc(a.tipo)}</span><span class="mut">para ${esc(a.destino)} · ${br(a.ts)}${a.validade ? ' · até ' + br(a.validade) : ''}</span></div><b>${esc(a.titulo)}</b><span>${esc(a.texto)}</span>${a.link ? `<a href="${esc(a.link)}" target="_blank">${esc(a.link)}</a>` : ''}<button class="sm ghost" data-rmav="${a.id}">Remover</button></div>`).join('')}</div></div>`;
}
function regAus() {
  return `<div class="card"><h2>Ausências, atrasos e saídas para prova</h2><div class="tw"><table><tr><th>Enviada</th><th>Estagiário</th><th>Tipo / data</th><th>Motivo</th><th>Comprovante</th><th>Ciência</th></tr>
  ${S.comunicacoes.map(c => `<tr><td>${brts(c.ts)}</td><td>${who(c.estId, c.nome, 1)}<br><span class="mut">${esc(c.central)}</span></td><td>${esc(c.tipo)}<br>${br(c.data)} ${esc(c.hIni)}${c.hFim ? '–' + esc(c.hFim) : ''}</td><td>${esc(c.motivo)}</td>
  <td>${c.anexoUrl ? `<a href="${esc(c.anexoUrl)}" target="_blank">abrir</a>` : ''}</td><td><span class="mut">Sup.: ${esc(c.supCiente) || '—'}<br>Local: ${esc(c.locCiente) || '—'}</span><br>${c.regCiente ? '<span class="pill ok">Regional ciente</span>' : `<button class="sm gold" data-regcc="${c.id}">Ciente</button>`}</td></tr>`).join('')}</table></div></div>`;
}
function regCham() { return `<div class="card"><h2>Chamados</h2><div class="list">${S.chamados.map(c => chamadoItem(c, /Regional/.test(c.para))).join('') || '<span class="mut">Nenhum chamado.</span>'}</div></div>`; }
function regRel() {
  return `<div class="card"><h2>Relatórios mensais de supervisão</h2><span class="mut">Fluxo: supervisor conclui e dá Ciente → estagiário se manifesta e dá Ciente → responsável local dá Ciente (quando não é o próprio supervisor) → regional dá Ciente final. O PDF com o timbrado vai para a pasta Prontuários do Drive, pronto para imprimir no prontuário físico.</span>
  <div class="list">${S.relatorios.map(r => `<div class="item"><div class="row sp">${av(r.estId, r.estNome)}<b>${esc(r.estNome)} · ${mesNome(r.mes)}</b>${statusPill(r.status)}</div><span class="mut">${esc(r.central)}</span>
  <div class="row"><button class="sm ghost" data-rrv="${r.id}">Ver</button>${r.status === 'Aguardando regional' ? `<button class="sm gold" data-rrc="${r.id}">Dar Ciente</button>` : ''}${r.status === 'Concluído' ? `<button class="sm ghost" data-rpdf="${r.id}">Gerar PDF</button>` : ''}${r.pdfUrl ? `<a class="btn sm gold" href="${esc(r.pdfUrl)}" target="_blank">Abrir PDF</a>` : ''}</div></div>`).join('') || '<span class="mut">Nenhum relatório.</span>'}</div></div>
  <div class="card"><h3 class="sec-h">Supervisões marcadas</h3><div class="tw"><table><tr><th>Data</th><th>Estagiário</th><th>Estagiário ciente</th><th>Responsável local</th><th>Link</th></tr>${S.supervisoes.map(s => `<tr><td>${br(s.data)} ${esc(s.hora)}</td><td>${esc((S.estagiarios.find(e => e.id === s.estId) || {}).nome)}</td><td>${s.estCiente ? brts(s.estCiente) : '<span class="pill warn">pendente</span>'}</td><td>${s.locNA ? 'não se aplica' : s.locCiente ? esc(s.locCiente) : '<span class="pill warn">pendente</span>'}</td><td>${s.link ? `<a href="${esc(s.link)}" target="_blank">abrir</a>` : ''}</td></tr>`).join('')}</table></div></div>`;
}
function regPed() {
  return `<div class="card" style="border-color:var(--bad)"><h2>TCE terminando em até 45 dias</h2><div class="tw"><table><tr><th>Estagiário</th><th>Central</th><th>Fim do TCE</th><th>Faltam</th><th>Prorrogação</th><th></th></tr>
  ${S.alertasTce.map(a => { const e = S.estagiarios.find(x => x.id === a.id), sl = S.solicitacoes.find(x => x.estId === a.id && x.tipo === 'Prorrogação');
    return `<tr><td>${who(a.id, a.nome, 1)}</td><td>${esc(a.central)}</td><td>${br(a.fim)}</td><td>${a.dias} dias</td><td>${sl ? esc(sl.status) : 'sem manifestação'}</td><td><a class="btn sm gold" target="_blank" href="${waLink(e.telefone, 'Olá, ' + a.nome.split(' ')[0] + '! Seu TCE termina em ' + br(a.fim) + '. Se tiver interesse em prorrogar o estágio, abra o aplicativo Controle de Estágio e envie o comprovante de matrícula atualizado na tela inicial. ' + S.regional)}">Lembrar</a></td></tr>`; }).join('') || '<tr><td colspan="6" class="mut">Nenhum TCE terminando nos próximos 45 dias.</td></tr>'}</table></div></div>
  <div class="card"><h2>Pedidos de prorrogação e recesso</h2><span class="mut">Quando todas as confirmações chegam, o pedido fica “em análise” pelo concedente. Registre aqui cada passo (solicitado ao CIEE → aditivo emitido / recesso aprovado, ou indeferido): o estagiário, o supervisor e o responsável local veem a situação do concedente e o estagiário recebe um aviso.</span>
  <div class="list">${S.solicitacoes.map(x => solItem(x, 'reg') + regAcoes(x)).join('') || '<span class="mut">Nenhum pedido.</span>'}</div></div>`;
}
function regAcoes(x) {
  const rec = x.tipo === 'Recesso';
  const passo = x.status === 'Aguardando regional' ? (rec ? 'Recesso solicitado ao CIEE' : 'Aditivo solicitado ao CIEE')
    : /solicitado ao CIEE/.test(x.status) ? (rec ? 'Recesso aprovado pelo CIEE' : 'Aditivo emitido pelo CIEE') : '';
  if (!passo) return '';
  return `<div class="row"><input data-regobs="${x.id}" placeholder="Observação (vai para o estagiário)" style="flex:1;min-width:160px"><button class="sm gold" data-regst="${x.id}|${passo}">${passo}</button><button class="sm ghost" data-regst="${x.id}|Indeferido">Indeferir</button></div>`;
}
function regPag() {
  const mes = SUBTAB && /^\d{4}-\d{2}$/.test(SUBTAB) ? SUBTAB : (() => { const [y, m] = S.mesAtual.split('-').map(Number); const d = new Date(y, m - 2, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); })();
  const L = ativos();
  const last = id => S.pagamentos.filter(p => p.estId === id).sort((a, b) => a.mes < b.mes ? 1 : -1);
  return `<div class="card"><h2>Lançar pagamentos (após lançar no portal do CIEE)</h2><span class="mut">O estagiário vê os valores no aplicativo antes do 10º dia útil.</span>
  <div class="grid2"><label class="f">Mês estagiado<input type="month" id="pgMes" value="${mes}"></label><label class="f">Data do pagamento (10º dia útil)<input type="date" id="pgData"></label></div>
  <div class="tw"><table><tr><th>Estagiário</th><th>Bolsa (R$)</th><th>Dias</th><th>VT/dia (R$)</th><th>Total</th><th>Obs.</th><th>Recebimento</th></tr>
  ${L.map(e => { const p = last(e.id).find(x => x.mes === mes) || last(e.id)[0] || {}; const same = p.mes === mes;
    return `<tr data-pg="${e.id}" data-nome="${esc(e.nome)}"><td>${who(e.id, e.nome, 1)}<br><span class="mut">${esc(e.central)}</span></td><td><input data-b value="${esc(p.bolsa || '')}" style="width:100px"></td><td><input data-d value="${same ? esc(p.dias) : ''}" style="width:60px"></td><td><input data-v value="${esc(p.vtDia || '')}" style="width:80px"></td><td data-t>${same ? money(p.total) : ''}</td><td><input data-o value="${same ? esc(p.obs) : ''}" style="width:140px"></td>
    <td>${!same ? '' : p.recebido === 'Sim' ? `<span class="pill ok">Recebido ${br(p.recebidoEm)}</span>` : p.recebido === 'Não' ? `<span class="pill bad">Não recebeu</span><br><span class="mut">${esc(p.recebidoObs)}</span>` : '<span class="pill warn">aguardando</span>'}</td></tr>`; }).join('')}</table></div>
  <button class="gold" id="pgBtn">Salvar e publicar para os estagiários</button></div>`;
}
function regRec() {
  return `<div class="card"><h2>Saldo de recesso (Lei 11.788/2008, art. 13)</h2><span class="mut">30 dias por ano de estágio (2,5 dias por mês completo), proporcional quando o TCE for menor que um ano. Direito, acumulado e saldo são calculados automaticamente pela vigência do TCE; lance aqui só os dias gozados.</span><div class="tw"><table><tr><th>Estagiário</th><th>Período aquisitivo</th><th>Direito</th><th>Gozados</th><th>Saldo</th><th>Obs.</th><th></th></tr>
  ${ativos().map(e => { const r = S.recesso.find(x => x.estId === e.id) || {}; return `<tr data-rc="${e.id}" data-nome="${esc(e.nome)}"><td>${who(e.id, e.nome, 1)}</td><td><input data-p value="${esc(r.periodo || br(e.inicio) + ' a ' + br(e.fim))}" style="width:190px"></td><td><input data-di value="${esc(r.direito || '')}" style="width:60px"></td><td><input data-g value="${esc(r.gozados || '')}" style="width:60px"></td><td><b>${String(r.saldo).replace('.', ',')}</b><br><span class="mut">acumulado ${String(r.acumulado).replace('.', ',')} (${esc(r.meses)} meses)</span></td><td><input data-o value="${esc(r.obs || '')}" style="width:140px"></td><td><button class="sm gold" data-rcb="${e.id}">Salvar</button></td></tr>`; }).join('')}</table></div></div>`;
}
function regDocs() {
  return `<div class="card"><h2>Enviar documento ao estagiário</h2>
  <div class="grid2"><label class="f">Para<select id="rdEst"><option value="*">Todos os estagiários</option>${ativos().map(e => `<option value="${e.id}">${esc(e.nome)}</option>`).join('')}</select></label>
  <label class="f">Tipo<select id="rdTipo"><option>TCE</option><option>Termo aditivo</option><option>Manual de estágio</option><option>Plano de atividades</option><option>Material de estágio</option><option>Outro</option></select></label>
  <label class="f">Nome<input id="rdNome" placeholder="Ex.: TCE nº 9991411"></label></div>
  <label class="f">Arquivo (PDF)<input type="file" id="rdArq" accept="application/pdf,image/&#42;"></label><span class="mut">ou</span><label class="f">Link já existente (Drive, site)<input id="rdLink" placeholder="https:\/\/"></label>
  <button class="gold" id="rdBtn">Disponibilizar</button></div>
  <div class="card"><h3 class="sec-h">Documentos</h3><div class="tw"><table><tr><th>Data</th><th>Estagiário</th><th>Tipo</th><th>Nome</th><th>Enviado por</th></tr>${S.docs.map(d => `<tr><td>${br(d.ts)}</td><td>${d.estId === '*' ? 'Todos' : esc((S.estagiarios.find(e => e.id === d.estId) || {}).nome)}</td><td>${esc(d.tipo)}</td><td><a href="${esc(d.url)}" target="_blank">${esc(d.nome)}</a></td><td>${esc(d.enviadoPor)}</td></tr>`).join('')}</table></div></div>`;
}
function bindReg() {
  bindLocal(); bindSol();
  const fc = $('#fc'); if (fc) fc.onchange = () => { SUBTAB = fc.value; render(); };
  bindResp();
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
    const t = b.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Link copiado.'))
      .catch(() => overlay(`<h3>Copie o link</h3><input value="${esc(t)}" onfocus="this.select()"><button class="ghost" onclick="closeOv()">Fechar</button>`));
  });
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = e => { const [k, id] = b.dataset.reset.split(':'); act(e.target, 'resetDevice', { kind: k, id }, 'Aparelho liberado. O próximo celular que abrir o link fica vinculado.'); });
  document.querySelectorAll('[data-rlib]').forEach(b => b.onclick = e => act(e.target, 'liberarFoto', { id: b.dataset.rlib }, 'Troca liberada. O estagiário pode enviar uma nova foto.'));
  document.querySelectorAll('[data-rfok]').forEach(b => b.onclick = e => act(e.target, 'aprovarFoto', { id: b.dataset.rfok, aprovar: true }, 'Foto aprovada.'));
  document.querySelectorAll('[data-rmfoto]').forEach(b => b.onclick = e => act(e.target, 'removerFoto', { id: b.dataset.rmfoto }, 'Foto removida. O estagiário pode enviar outra.'));
    document.querySelectorAll('[data-ativo]').forEach(s => s.onchange = () => act(null, 'ativo', { id: s.dataset.ativo, ativo: s.value }, 'Situação atualizada.'));
  const av = $('#avBtn'); if (av) av.onclick = e => { if (!$('#avTit').value.trim()) return toast('Informe o título.');
    act(e.target, 'aviso', { tipo: $('#avTipo').value, destino: $('#avDest').value, validade: $('#avVal').value, titulo: $('#avTit').value.trim(), texto: $('#avTxt').value.trim(), link: $('#avLink').value.trim() }, 'Aviso publicado.'); };
  document.querySelectorAll('[data-rmav]').forEach(b => b.onclick = e => act(e.target, 'removerAviso', { id: b.dataset.rmav }, 'Aviso removido.'));
  document.querySelectorAll('[data-regcc]').forEach(b => b.onclick = e => act(e.target, 'cienteComunicacao', { id: b.dataset.regcc }, 'Ciência registrada.'));
  document.querySelectorAll('[data-rrv]').forEach(b => b.onclick = () => overlay(relHtml(S.relatorios.find(r => r.id === b.dataset.rrv)) + '<button class="ghost" onclick="closeOv()">Fechar</button>'));
  document.querySelectorAll('[data-rrc]').forEach(b => b.onclick = () => {
    const r = S.relatorios.find(x => x.id === b.dataset.rrc);
    const o = overlay(relHtml(r) + `<div class="card" style="border-color:var(--ouro)"><b>Ciência da regional</b><label class="f">Local<input id="rgLoc" value="São Paulo"></label><button class="gold big" id="rgOk">Ciente – gerar PDF para o prontuário</button></div><button class="ghost" onclick="closeOv()">Fechar</button>`);
    o.querySelector('#rgOk').onclick = async e => { e.target.disabled = true; e.target.textContent = 'Gerando PDF…';
      try { const x = await call('cienteRelatorio', { id: r.id, local: o.querySelector('#rgLoc').value.trim() }); closeOv(); await reload(); overlay(`<h2>Ciência registrada</h2><a class="btn gold big" href="${x.pdfUrl}" target="_blank">Abrir PDF para imprimir</a><button class="ghost" onclick="closeOv()">Fechar</button>`); }
      catch (err) { toast('Erro: ' + err.message); e.target.disabled = false; } };
  });
  document.querySelectorAll('[data-rpdf]').forEach(b => b.onclick = async () => { b.textContent = 'Gerando…'; try { const x = await call('pdf', { id: b.dataset.rpdf }); await reload(); overlay(`<a class="btn gold big" href="${x.pdfUrl}" target="_blank">Abrir PDF</a><button class="ghost" onclick="closeOv()">Fechar</button>`); } catch (e) { toast(e.message); } });
  document.querySelectorAll('[data-regst]').forEach(b => b.onclick = e => { const [id, st] = b.dataset.regst.split('|');
    act(e.target, 'solicitacao', { id, status: st, obs: (document.querySelector(`[data-regobs="${id}"]`) || {}).value || '' }, 'Pedido atualizado.'); });
  const pgm = $('#pgMes'); if (pgm) pgm.onchange = () => { SUBTAB = pgm.value; render(); };
  document.querySelectorAll('[data-pg]').forEach(tr => tr.oninput = () => { const n = s => Number(String(s).replace(',', '.')) || 0;
    const b = n(tr.querySelector('[data-b]').value), d = n(tr.querySelector('[data-d]').value), v = n(tr.querySelector('[data-v]').value); tr.querySelector('[data-t]').textContent = money(b + d * v); });
  const pb = $('#pgBtn'); if (pb) pb.onclick = e => {
    if (!$('#pgData').value) return toast('Informe a data do pagamento.');
    const n = s => Number(String(s).replace(',', '.')) || 0;
    const linhas = [...document.querySelectorAll('[data-pg]')].filter(tr => tr.querySelector('[data-b]').value && tr.querySelector('[data-d]').value).map(tr => {
      const b = n(tr.querySelector('[data-b]').value), d = n(tr.querySelector('[data-d]').value), v = n(tr.querySelector('[data-v]').value);
      return { estId: tr.dataset.pg, nome: tr.dataset.nome, bolsa: b, dias: d, vtDia: v, vt: +(d * v).toFixed(2), total: +(b + d * v).toFixed(2), obs: tr.querySelector('[data-o]').value };
    });
    if (!linhas.length) return toast('Preencha bolsa e dias de ao menos um estagiário.');
    act(e.target, 'pagamentos', { mes: $('#pgMes').value, dataPagto: $('#pgData').value, linhas }, linhas.length + ' pagamento(s) publicados.');
  };
  document.querySelectorAll('[data-rcb]').forEach(b => b.onclick = e => { const tr = document.querySelector(`[data-rc="${b.dataset.rcb}"]`);
    act(e.target, 'recesso', { estId: b.dataset.rcb, nome: tr.dataset.nome, periodo: tr.querySelector('[data-p]').value, direito: tr.querySelector('[data-di]').value, gozados: tr.querySelector('[data-g]').value, obs: tr.querySelector('[data-o]').value }, 'Recesso salvo.'); });
  const rd = $('#rdBtn'); if (rd) rd.onclick = async e => {
    const est = $('#rdEst').value, nome = $('#rdNome').value.trim() || $('#rdTipo').value, estNome = est === '*' ? 'Todos' : (S.estagiarios.find(x => x.id === est) || {}).nome;
    if ($('#rdLink').value.trim()) return act(e.target, 'documentoLink', { estId: est, tipo: $('#rdTipo').value, nome, url: $('#rdLink').value.trim() }, 'Documento disponibilizado.');
    let a; try { a = await fileToB64($('#rdArq').files[0]); } catch (x) { return toast(x.message); }
    act(e.target, 'documento', { estId: est, estNome, tipo: $('#rdTipo').value, nome, b64: a.b64, mime: a.mime }, 'Documento disponibilizado.');
  };
}

/* ============================== INÍCIO ============================== */
(function start() {
  if (!TOKEN) { $('#app').innerHTML = '<div class="card"><h2>Link incompleto</h2><p class="mut">Abra o link individual que você recebeu pelo WhatsApp da SRPMA Metropolitana de São Paulo.</p></div>'; return; }
  call('boot').then(d => { S = d; render(); }).catch(e => {
    const m = e.message;
    const t = m === 'DEVICE' ? ['Link já ativado em outro aparelho', 'Este link individual está vinculado ao primeiro celular em que foi aberto. Se você trocou de aparelho ou limpou os dados do navegador, peça à SRPMA Metropolitana de São Paulo para liberar o novo aparelho (WhatsApp (11) 91785-7353).']
      : m === 'INATIVO' ? ['Acesso encerrado', 'Este estágio não está mais ativo no aplicativo.']
      : m === 'TOKEN' ? ['Link inválido', 'Confira se abriu o link completo enviado pelo WhatsApp da SRPMA Metropolitana de São Paulo.']
      : ['Não foi possível carregar', m];
    $('#app').innerHTML = `<div class="card"><h2>${t[0]}</h2><p class="mut">${esc(t[1])}</p>${m === 'DEVICE' ? `<div class="item" style="border-color:var(--ouro)"><b>Este é o seu celular?</b><span class="mut">Se você abriu o link antes por outro navegador (por exemplo, pelo WhatsApp e agora pelo Chrome ou Safari), pode passar a usar o aplicativo aqui. O link deixa de funcionar no navegador anterior e a regional é avisada.</span><button class="gold big" id="devBtn">Usar neste aparelho</button></div>` : ''}</div>`;
  const db = $('#devBtn'); if (db) db.onclick = async () => { db.disabled = true; db.textContent = 'Transferindo…'; try { await call('trocarAparelho', { confirmo: true }); location.reload(); } catch (x) { db.disabled = false; db.textContent = 'Usar neste aparelho'; toast('Erro: ' + x.message); } };
  });
})();
</script>
</body>
</html>
